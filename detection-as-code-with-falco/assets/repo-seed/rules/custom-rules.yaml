# Detection rules, managed as code. Add your rules below.
# The pipeline validates, deploys and tests everything in this file on `git push`.

# The pipeline uses this synthetic "marker" rule as a barrier: to prove the
# detection path (Falco -> Falcosidekick -> receiver) is alive before it trusts
# a "this rule did NOT fire" result. Leave it in place.
- rule: CI pipeline marker
  desc: Synthetic barrier event the pipeline emits to confirm the detection path is live.
  condition: spawned_process and container and proc.name = echo and proc.args startswith "dac-marker-"
  output: "CI marker (marker=%proc.args pod=%k8s.pod.name ns=%k8s.ns.name)"
  priority: INFO
  tags: [dac, ci]
